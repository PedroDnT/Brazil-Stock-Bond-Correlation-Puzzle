name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

# Publishes site/ to https://pedrodnt.github.io/Brazil-Stock-Bond-Correlation-Puzzle/
#
# GitHub Pages must already be enabled with Source = GitHub Actions
# (Settings → Pages → Build and deployment). actions/configure-pages 404s
# until that site exists, and GITHUB_TOKEN cannot create it (admin API).
# If Pages is missing, we skip deploy so default-branch CI stays green.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # index.html is generated, never hand-edited. Rebuild it from
      # template.html so the deployed page cannot drift from the source.
      # build.py is stdlib-only and must run from inside site/.
      - name: Build site
        working-directory: site
        run: python3 build.py

      - name: Check Pages is enabled for GitHub Actions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          probe() {
            curl -sS -o /tmp/pages.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          }
          code=$(probe)
          if [ "$code" != "200" ]; then
            sleep 15
            code=$(probe)
          fi
          build_type=$(jq -r '.build_type // empty' /tmp/pages.json 2>/dev/null || true)
          if [ "$code" = "200" ] && [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. In the repo: Settings → Pages → Build and deployment → Source = GitHub Actions. The site was built; deploy is skipped so CI stays green."
          elif [ "$code" = "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is enabled but build_type is '${build_type}', not 'workflow'. Set Settings → Pages → Source = GitHub Actions. Deploy skipped."
          else
            echo "::error::GET /pages returned HTTP ${code} (build_type='${build_type}')."
            cat /tmp/pages.json || true
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ready == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
