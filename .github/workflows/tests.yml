name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  estimators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Only the estimator tests run here. tests/test_paper_consistency.py checks
      # every number in the paper and README against outputs/, which is gitignored
      # and regenerates from live BCB, IPEADATA, Tesouro and FRED calls -- too slow
      # and too flaky for CI. Run it locally after `python3 src/fetch.py`.
      - run: python3 -m pytest tests/test_metrics.py tests/test_global_data.py -q
